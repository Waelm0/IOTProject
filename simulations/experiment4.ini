include omnetpp.ini

[Config StrategyBase]
extends = Baseline
sim-time-limit = 1800s
repeat = 5
seed-set = ${repetition}
result-dir = results_ipv6/strategy
output-scalar-file = "${resultdir}/${configname}-${iterationvarsf}rep${repetition}.sca"
**.vector-recording = false
cmdenv-express-mode = true
cmdenv-autoflush = false
**.cmdenv-log-level = off
*.numTempHumidity = 4
*.numOccupancyMotion = 4
*.numSmokeEnv = 4
*.numActuators = 1
# Fixed node layout; H=0.1s deliberately stresses the shared access channel.
**.tempHumiditySensor[*].app[0].sendInterval = ${H=10,0.1}s
**.occupancyMotionSensor[*].app[0].sendInterval = ${H}s
**.smokeEnvSensor[*].app[0].typename = "smarthome.StrategyApp"
**.smokeEnvSensor[*].app[0].messageLength = 50B
**.smokeEnvSensor[*].app[0].eventStart = 1s + ancestorIndex(1) * 0.03s
**.smokeEnvSensor[*].app[0].eventInterval = 10s
**.smokeEnvSensor[*].app[0].localPort = 3000
**.smokeEnvSensor[*].app[0].startTime = 0s
**.app[*].result-recording-modes = default

[Config RequestResponse]
extends = StrategyBase
**.smokeEnvSensor[*].app[0].role = "sensor"
**.smokeEnvSensor[*].app[0].destAddresses = ""
**.monitoringApp.numApps = 4
**.monitoringApp.app[*].typename = "smarthome.StrategyApp"
**.monitoringApp.app[*].role = "poller"
**.monitoringApp.app[*].localPort = 4000 + index
**.monitoringApp.app[*].destAddresses = "smokeEnvSensor[" + string(index) + "]%wlan0(ipv6)"
**.monitoringApp.app[*].destPort = 3000
**.monitoringApp.app[*].messageLength = 20B
**.monitoringApp.app[*].sendInterval = ${T=1,5,10,30,60}s
**.monitoringApp.app[*].startTime = 1.2s + uniform(0s, this.sendInterval)

[Config PublishSubscribe]
extends = StrategyBase
**.smokeEnvSensor[*].app[0].role = "publisher"
**.smokeEnvSensor[*].app[0].destAddresses = "gateway%wlan0(ipv6)"
**.smokeEnvSensor[*].app[0].destPort = 3000
**.smokeEnvSensor[*].app[0].sendInterval = 10s
**.smokeEnvSensor[*].app[0].startTime = 1s + ancestorIndex(1) * 0.03s
**.gateway.app[1].typename = "smarthome.StrategyApp"
**.gateway.app[1].role = "broker"
**.gateway.app[1].localPort = 3000
**.gateway.app[1].destAddresses = ""
**.gateway.app[1].destPort = 4000
**.gateway.app[1].messageLength = 50B
**.gateway.app[1].sendInterval = 10s
**.gateway.app[1].startTime = 0s
**.monitoringApp.app[0].typename = "smarthome.StrategyApp"
**.monitoringApp.app[0].role = "subscriber"
**.monitoringApp.app[0].localPort = 4000
**.monitoringApp.app[0].destAddresses = ""
**.monitoringApp.app[0].destPort = 3000
**.monitoringApp.app[0].messageLength = 50B
**.monitoringApp.app[0].sendInterval = 10s
**.monitoringApp.app[0].startTime = 0s
