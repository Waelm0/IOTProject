[General]
network = SmartHomeNetwork
sim-time-limit = 100s

# IPv6-only stack for every host/router. Static addresses and routes are
# installed by SmartHomeIpv6Configurator; IPv6 Neighbor Discovery stays active.
**.hasIpv4 = false
**.hasIpv6 = true
*.gateway.forwarding = true
result-dir = results_ipv6/${configname}
output-scalar-file = "${resultdir}/${configname}-${iterationvarsf}rep${repetition}.sca"
output-vector-file = "${resultdir}/${configname}-${iterationvarsf}rep${repetition}.vec"
# Keep full scalar/histogram statistics; enable selected vectors per experiment.
**.vector-recording = false

# --- Fix Node Status error required by SimpleEpEnergyStorage ---
**.hasStatus = true

# --- Radio: every constrained node + gateway wireless side uses 802.15.4 ---
**.tempHumiditySensor[*].wlan[0].typename = "Ieee802154NarrowbandInterface"
**.occupancyMotionSensor[*].wlan[0].typename = "Ieee802154NarrowbandInterface"
**.smokeEnvSensor[*].wlan[0].typename = "Ieee802154NarrowbandInterface"
**.actuator[*].wlan[0].typename = "Ieee802154NarrowbandInterface"
**.gateway.wlan[0].typename = "Ieee802154NarrowbandInterface"

# Enable UDP layer on gateway router
**.gateway.hasUdp = true

**.radioMedium.backgroundNoise.power = -110dBm

# --- Radio Power Tuning (Overcomes Range Losses) ---
**.wlan[*].radio.transmitter.power = 50mW
**.wlan[*].radio.receiver.sensitivity = -100dBm

# --- Node Positions Centered Around Gateway (400m, 280m) ---
**.tempHumiditySensor[*].mobility.typename = "StationaryMobility"
**.tempHumiditySensor[*].mobility.initialX = 320m + parentIndex() * 30m
**.tempHumiditySensor[*].mobility.initialY = 240m

**.occupancyMotionSensor[*].mobility.typename = "StationaryMobility"
**.occupancyMotionSensor[*].mobility.initialX = 320m + parentIndex() * 30m
**.occupancyMotionSensor[*].mobility.initialY = 260m

**.smokeEnvSensor[*].mobility.typename = "StationaryMobility"
**.smokeEnvSensor[*].mobility.initialX = 320m + parentIndex() * 30m
**.smokeEnvSensor[*].mobility.initialY = 280m

**.actuator[*].mobility.typename = "StationaryMobility"
**.actuator[*].mobility.initialX = 320m + parentIndex() * 30m
**.actuator[*].mobility.initialY = 300m

**.gateway.mobility.typename = "StationaryMobility"
**.gateway.mobility.initialX = 400m
**.gateway.mobility.initialY = 280m

# IPv6 addressing is defined in src/SmartHomeIpv6Configurator.cc.
# The old topology.xml files are historical IPv4 inputs and are not loaded.

# --- Energy Initialization ---
**.energyStorage.typename = "SimpleEpEnergyStorage"
**.energyStorage.nominalCapacity = 10000J
**.energyStorage.initialCapacity = 10000J
**.energyConsumer.typename = "StateBasedEpEnergyConsumer"
**.energyStorage.residualEnergyCapacity.result-recording-modes = +last

# ============================================================
# [Config Baseline] -- Stage 2 milestone: verify packet exchange
# ============================================================
[Config Baseline]

# --- Periodic monitoring traffic: sensors -> gateway ---
**.tempHumiditySensor[*].numApps = 1
**.tempHumiditySensor[*].app[0].typename = "UdpBasicApp"
**.tempHumiditySensor[*].app[0].destAddresses = "gateway%wlan0(ipv6)"
**.tempHumiditySensor[*].app[0].destPort = 1000
**.tempHumiditySensor[*].app[0].sendInterval = 10s
**.tempHumiditySensor[*].app[0].messageLength = 50B
**.tempHumiditySensor[*].app[0].startTime = uniform(0s, 1s)
**.tempHumiditySensor[*].app[0].packetName = "TempHumidityReport"

**.occupancyMotionSensor[*].numApps = 1
**.occupancyMotionSensor[*].app[0].typename = "UdpBasicApp"
**.occupancyMotionSensor[*].app[0].destAddresses = "gateway%wlan0(ipv6)"
**.occupancyMotionSensor[*].app[0].destPort = 1000
**.occupancyMotionSensor[*].app[0].sendInterval = 10s
**.occupancyMotionSensor[*].app[0].messageLength = 50B
**.occupancyMotionSensor[*].app[0].startTime = uniform(0s, 1s)
**.occupancyMotionSensor[*].app[0].packetName = "OccupancyReport"

# --- Low-rate periodic smoke reports; CriticalEvent randomizes these below ---
**.smokeEnvSensor[*].numApps = 1
**.smokeEnvSensor[*].app[0].typename = "UdpBasicApp"
**.smokeEnvSensor[*].app[0].destAddresses = "gateway%wlan0(ipv6)"
**.smokeEnvSensor[*].app[0].destPort = 1001
**.smokeEnvSensor[*].app[0].sendInterval = 30s
**.smokeEnvSensor[*].app[0].messageLength = 50B
**.smokeEnvSensor[*].app[0].startTime = uniform(0s, 1s)
**.smokeEnvSensor[*].app[0].packetName = "AlarmEvent"

# --- Actuators: sinks ---
**.actuator[*].numApps = 1
**.actuator[*].app[0].typename = "UdpSink"
**.actuator[*].app[0].localPort = 1002

# --- Gateway: sinks for sensor uplinks ---
**.gateway.numApps = 2
**.gateway.app[0].typename = "UdpSink"
**.gateway.app[0].localPort = 1000
**.gateway.app[1].typename = "UdpSink"
**.gateway.app[1].localPort = 1001

# --- Core monitoring app ---
**.monitoringApp.numApps = 1
**.monitoringApp.app[0].typename = "UdpSink"
**.monitoringApp.app[0].localPort = 2000

# ============================================================
# [Config Scalability] -- Experiment 1: Network Scalability
# ============================================================
[Config Scalability]
extends = Baseline
sim-time-limit = 1800s
repeat = 5
seed-set = ${repetition}

# --- Sweep N across the recommended points, split across the two
#     periodic-monitoring sensor types. smokeEnv (alarm source) and
#     actuator (pure sink) are held fixed since this experiment
#     targets periodic-traffic-driven congestion specifically. ---
*.numTempHumidity = int(ceil(${N=5,10,20,30,40} / 2))
*.numOccupancyMotion = int(floor(${N} / 2))
*.numSmokeEnv = 2
*.numActuators = 1

# --- Make sure delay/PDR/energy stats are actually recorded ---
**.app[*].result-recording-modes = all
**.radio.**.result-recording-modes = all

# ============================================================
# [Config ReportingInterval] -- Experiment 2: Reporting Interval
# ============================================================
[Config ReportingInterval]
extends = Baseline
sim-time-limit = 1800s
repeat = 5
seed-set = ${repetition}

# --- Node counts stay at NED defaults (4,4,4,3) -- untouched ---

# --- Sweep the periodic monitoring sensors' reporting interval ---
*.tempHumiditySensor[*].app[0].sendInterval = ${T=1,5,10,30,60}s
*.occupancyMotionSensor[*].app[0].sendInterval = ${T}s

# --- Packet size stays fixed (inherited from Baseline: 50B) ---
# --- smokeEnvSensor stays at its own fixed 30s critical-traffic interval,
#     unaffected by T, since it's not "periodic monitoring" per the handout ---

**.app[*].result-recording-modes = all
**.radio.**.result-recording-modes = all

# ============================================================
# [Config CriticalEvent] -- Experiment 3:
# Critical smoke/environment event under background traffic
# ============================================================
[Config CriticalEvent]
extends = Baseline
sim-time-limit = 1800s
repeat = 5
seed-set = ${repetition}

# Background load levels:
# More periodic sensors create more contention around the gateway.
*.numTempHumidity = int(ceil(${B=5,10,20,30} / 2))
*.numOccupancyMotion = int(floor(${B} / 2))
*.numSmokeEnv = 2
*.numActuators = 1

# Normal background monitoring traffic
**.tempHumiditySensor[*].app[0].sendInterval = 10s
**.occupancyMotionSensor[*].app[0].sendInterval = 10s

# Critical event traffic:
# Each transmission represents a random alarm event after background startup.
**.smokeEnvSensor[*].app[0].startTime = uniform(300s, 600s)
**.smokeEnvSensor[*].app[0].sendInterval = exponential(30s)
**.smokeEnvSensor[*].app[0].messageLength = 50B
**.smokeEnvSensor[*].app[0].packetName = "CriticalSmokeAlarm"

result-dir = results_ipv6/CriticalEvent
output-scalar-file = "${resultdir}/${configname}-${iterationvarsf}rep${repetition}.sca"
output-vector-file = "${resultdir}/${configname}-${iterationvarsf}rep${repetition}.vec"

# Keep the specific recording rule before the general rule.
**.gateway.app[1].endToEndDelay:vector.vector-recording = true
**.vector-recording = false

# Record metrics needed for delay, loss, jitter/max delay, throughput
**.app[*].result-recording-modes = all
**.radio.**.result-recording-modes = all
**.mac.**.result-recording-modes = all
